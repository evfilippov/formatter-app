server:
  port: 8080
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: formatter
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
