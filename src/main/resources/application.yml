server:
  port: 8080
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: formatter
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    async:
      request-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    # Разрешённые origin для /api/**. На проде переопределить (через property или env APP_CORS_ALLOWED_ORIGINS).
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080

logging:
  level:
    # Поставь DEBUG, чтобы видеть диагностику намеренных пропусков при нормализации логов.
    com.example.formatter: INFO
